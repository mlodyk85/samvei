name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Align Expo dependencies
        env:
          CI: '1'
        run: npx expo install --fix

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Generate app icon
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          mkdir -p assets
          rsvg-convert -w 1024 -h 1024 -o assets/icon.png assets/icon.svg
          cp assets/icon.png assets/adaptive-icon.png

      - name: Generate native Android project
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build installable release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Samvei-Scandinavia-v1.0.1.apk
          ls -lh Samvei-Scandinavia-v1.0.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Samvei-Scandinavia-v1.0.1-APK
          path: Samvei-Scandinavia-v1.0.1.apk
          if-no-files-found: error
          retention-days: 30
