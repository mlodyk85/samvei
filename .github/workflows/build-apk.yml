name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install updater modules
        env:
          CI: '1'
        run: npx expo install expo-file-system expo-intent-launcher

      - name: Align Expo dependencies
        env:
          CI: '1'
        run: npx expo install --fix

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Generate app icon
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          mkdir -p assets
          rsvg-convert -w 1024 -h 1024 -o assets/icon.png assets/icon.svg
          cp assets/icon.png assets/adaptive-icon.png

      - name: Generate native Android project
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build installable release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Samvei-Scandinavia-v1.0.5.apk
          ls -lh Samvei-Scandinavia-v1.0.5.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Samvei-Scandinavia-v1.0.5-APK
          path: Samvei-Scandinavia-v1.0.5.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp Samvei-Scandinavia-v1.0.5.apk Samvei-Scandinavia.apk
          if gh release view v1.0.5 >/dev/null 2>&1; then
            gh release upload v1.0.5 Samvei-Scandinavia.apk --clobber
          else
            gh release create v1.0.5 Samvei-Scandinavia.apk --title "Samvei 1.0.5" --notes "Aktualizacja aplikacji dostępna przed logowaniem oraz poprawiony reset hasła."
          fi
