name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract app
        run: |
          rm -rf samvei-scandinavia
          unzip -q samvei-scandinavia-mvp.zip
          test -f samvei-scandinavia/package.json

      - name: Install dependencies
        working-directory: samvei-scandinavia
        run: npm install --no-audit --no-fund

      - name: Align Expo dependencies
        working-directory: samvei-scandinavia
        env:
          CI: '1'
        run: npx expo install --fix


      - name: Generate native Android project
        working-directory: samvei-scandinavia
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build installable release APK
        working-directory: samvei-scandinavia/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare APK
        run: |
          cp samvei-scandinavia/android/app/build/outputs/apk/release/app-release.apk Samvei-Scandinavia.apk
          ls -lh Samvei-Scandinavia.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Samvei-Scandinavia-APK
          path: Samvei-Scandinavia.apk
          if-no-files-found: error
          retention-days: 30
